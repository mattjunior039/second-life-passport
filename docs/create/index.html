<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repair Station · Second Life Passport</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="topbar"><div class="wrap wide">
  <div class="logo">SL</div>
  <div class="brand">Second Life Passport · Repair Station<small>Issue a passport in under two minutes</small></div>
</div></div>

<main class="wrap wide">
  <div class="grid">
    <form id="f" class="card" autocomplete="off">
      <h2><span class="ico">💻</span> Device</h2>
      <div class="two">
        <div><label>Model</label><input name="model" value="Lenovo 100e Chromebook Gen 3"></div>
        <div><label>Passport ID</label><input name="pid"></div>
      </div>

      <h2 style="margin-top:22px"><span class="ico">🔋</span> Battery (from the device's own report)</h2>
      <label>Source</label>
      <select name="source">
        <option>ChromeOS Diagnostics</option>
        <option>Windows battery report (powercfg)</option>
        <option>Lenovo Vantage</option>
        <option>macOS battery controller</option>
      </select>
      <div class="three">
        <div><label>Health %</label><input name="health" type="number" step="0.1" value="87"></div>
        <div><label>Cycle count</label><input name="cycles" type="number" value="380"></div>
        <div><label>Capacity unit</label><input name="unit" value="mWh"></div>
      </div>
      <div class="two">
        <div><label>Design capacity (optional)</label><input name="design" type="number"></div>
        <div><label>Full-charge capacity (optional)</label><input name="full" type="number"></div>
      </div>

      <h2 style="margin-top:22px"><span class="ico">🛠️</span> Repairs (one per line: Part — what you did)</h2>
      <textarea name="repairs">Keyboard — Two sticking keys fixed; every key tested.</textarea>
      <label><input type="checkbox" name="genuine" checked style="width:auto"> Genuine Lenovo parts used</label>

      <h2 style="margin-top:22px"><span class="ico">✅</span> Checks passed</h2>
      <div id="checks" class="two"></div>

      <h2 style="margin-top:22px"><span class="ico">🔒</span> Data wipe</h2>
      <input name="wipe" value="ChromeOS Powerwash + verified">

      <h2 style="margin-top:22px"><span class="ico">✍️</span> Fixer</h2>
      <div class="two">
        <div><label>Your name</label><input name="fixer" value="Neil Gupta"></div>
        <div><label>Repair desk</label><input name="desk" value="Student Repair Desk"></div>
      </div>
      <label>Note to the next owner</label>
      <textarea name="note">Tested every key and port. The battery numbers came straight from the laptop, not from me. Tap the sticker if you need help.</textarea>
    </form>

    <div>
      <div class="card">
        <h2><span class="ico">🔮</span> Live forecast</h2>
        <div class="big" id="h">–</div>
        <div class="forecast" id="fc">–</div>
      </div>
      <div class="card">
        <h2><span class="ico">🏷️</span> Passport</h2>
        <button class="btn primary" id="issue" type="button">Issue passport</button>
        <div id="out" style="margin-top:14px"></div>
      </div>
    </div>
  </div>
</main>

<script src="../assets/vendor/qrcode.js"></script>
<script src="../assets/app.js"></script>
<script>
const CHECKS = ["Display", "Keyboard", "Touchpad", "Ports", "Wi-Fi & Bluetooth", "Camera & mic", "Storage", "Charging"];
const form = document.getElementById("f");
const q = new URLSearchParams(location.search);

document.getElementById("checks").innerHTML = CHECKS.map(c =>
  `<label style="margin:4px 0;color:var(--ink);font-weight:500"><input type="checkbox" name="check" value="${c}" checked style="width:auto"> ${c}</label>`).join("");
form.pid.value = "SLP-" + String(Math.floor(1000 + Math.random() * 9000));

// Health-check scripts open this page with measured values in the URL.
for (const k of ["model", "source", "health", "cycles", "design", "full", "unit"]) {
  if (q.get(k)) form[k].value = q.get(k);
}
if (q.get("design") && q.get("full")) form.health.value = SLP.healthFrom({ design: +q.get("design"), full: +q.get("full") });

function today() { return new Date().toLocaleDateString("en-US", { month: "short", year: "numeric" }); }

function battery() {
  const b = { health: +form.health.value, cycles: +form.cycles.value, source: form.source.value, measured_on: today() };
  if (form.design.value && form.full.value) Object.assign(b, { design: +form.design.value, full: +form.full.value, unit: form.unit.value });
  return b;
}

function update() {
  const f = SLP.forecast(battery());
  document.getElementById("h").innerHTML = `${f.health}%<small> health · ${form.cycles.value} cycles</small>`;
  const fc = document.getElementById("fc");
  fc.className = "forecast " + f.status;
  fc.innerHTML = SLP.esc(f.text) + (f.detail ? `<small>${SLP.esc(f.detail)}</small>` : "");
}
form.addEventListener("input", update);
update();

document.getElementById("issue").addEventListener("click", async () => {
  const genuine = form.genuine.checked;
  const record = {
    id: form.pid.value.trim(),
    model: form.model.value.trim(),
    refurbished_on: today(),
    battery: battery(),
    wipe: { method: form.wipe.value, date: today() },
    repairs: form.repairs.value.split("\n").map(s => s.trim()).filter(Boolean).map(line => {
      const [part, ...rest] = line.split(/\s+[—-]\s+/);
      return { part, detail: rest.join(" — "), date: today(), genuine };
    }),
    checks: [...form.querySelectorAll("[name=check]:checked")].map(c => ({ name: c.value, result: "Passed" })),
    fixer: { name: form.fixer.value, role: "Student fixer · " + form.desk.value, note: form.note.value },
    history: [{ date: today(), event: "Health check, data wipe and repairs" }, { date: today(), event: "Passport issued · ready for its second life" }],
    help: { desk: form.desk.value, battery_guide: "https://www.ifixit.com/Search?query=" + encodeURIComponent(form.model.value), battery_note: "Free step-by-step guides for this model" },
  };
  const url = `${SLP.siteRoot()}p/#d=${await SLP.encode(record)}`;
  const fp = await SLP.fingerprint(record);
  document.getElementById("out").innerHTML = `
    <div class="qrbox">${SLP.qrSvg(url, 6)}</div>
    <p style="text-align:center;font-weight:650;margin:10px 0 4px">Scan to open passport ${SLP.esc(record.id)}</p>
    <p class="fp" style="text-align:center">Fingerprint ${fp.slice(0, 16)}…</p>
    <p class="linkout"><a href="${url}" target="_blank">Open passport ↗</a></p>`;
});
</script>
</body>
</html>
